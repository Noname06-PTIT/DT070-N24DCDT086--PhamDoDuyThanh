<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DT070 - Pham Do Duy Thanh | N24DCDT086</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .header-card { background: linear-gradient(135deg, #1a237e, #283593); color: white; border-radius: 12px; }
        .result-box { background: #1e2a3a; color: #a8ff78; border-radius: 8px; min-height: 150px; font-family: monospace; font-size: 13px; }
        .step-item { border-left: 3px solid #1976d2; padding: 6px 12px; margin: 4px 0; background: #e3f2fd; border-radius: 0 6px 6px 0; font-size: 13px; }
        .step-item.ket_qua { border-left-color: #388e3c; background: #e8f5e9; }
        .step-item.quay_lui { border-left-color: #f57c00; background: #fff3e0; }
        .badge-info-box { background: #e8eaf6; border-radius: 8px; padding: 10px 16px; }
    </style>
</head>
<body>
<div class="container py-4">

    <!-- HEADER -->
    <div class="header-card p-4 mb-4 shadow">
        <h3 class="fw-bold mb-1">&#127919; Ung Dung Truc Quan Hoa Thuat Toan (DT070)</h3>
        <p class="mb-0 opacity-75">
            <strong>{{ info.ten_de }}</strong><br>
            Mon hoc: {{ info.mon_hoc }} &nbsp;|&nbsp;
            Sinh vien: <strong>{{ info.sinh_vien }}</strong> &nbsp;|&nbsp;
            MSSV: <strong>{{ info.mssv }}</strong>
        </p>
    </div>

    <!-- INPUT PANEL -->
    <div class="card shadow mb-4 p-4">
        <h5 class="fw-bold text-primary mb-3">&#9881; Nhap Du Lieu</h5>
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label fw-semibold">Gia tri n:</label>
                <input type="number" id="inputN" class="form-control" value="3" min="0" max="10">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Gia tri k (neu can):</label>
                <input type="number" id="inputK" class="form-control" placeholder="De trong neu khong can">
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary w-100" onclick="chayThuatToan()">&#9654; Chay Thuat Toan</button>
            </div>
        </div>
        <div id="errorMsg" class="alert alert-danger mt-3 d-none"></div>
    </div>

    <!-- RESULT PANEL -->
    <div class="row g-4">
        <div class="col-md-5">
            <div class="card shadow p-3 h-100">
                <h6 class="fw-bold text-success">&#128200; Ket Qua</h6>
                <div class="badge-info-box mb-2">
                    <span>So ket qua: <strong id="soKetQua">-</strong></span> &nbsp;|&nbsp;
                    <span>Tong buoc: <strong id="tongBuoc">-</strong></span>
                </div>
                <pre id="outputBox" class="result-box p-3">Chua co ket qua.</pre>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow p-3 h-100">
                <h6 class="fw-bold text-primary">&#128196; Lich Su Tung Buoc (Trace)</h6>
                <div id="traceBox" style="max-height: 350px; overflow-y: auto;">
                    <p class="text-muted">Chua co du lieu.</p>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
async function chayThuatToan() {
    const n = document.getElementById('inputN').value;
    const k = document.getElementById('inputK').value;
    const errEl = document.getElementById('errorMsg');
    errEl.classList.add('d-none');

    const body = { n: parseInt(n) };
    if (k !== '') body.k = parseInt(k);

    try {
        const res = await fetch('/api/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();

        if (data.status === 'error') {
            errEl.textContent = 'Loi: ' + data.message;
            errEl.classList.remove('d-none');
            return;
        }

        document.getElementById('soKetQua').textContent = data.so_ket_qua ?? data.ket_qua?.length ?? '-';
        document.getElementById('tongBuoc').textContent = data.tong_buoc ?? '-';
        document.getElementById('outputBox').textContent = JSON.stringify(data.ket_qua, null, 2);

        // Hien thi trace
        const traceBox = document.getElementById('traceBox');
        if (data.trace && data.trace.length > 0) {
            traceBox.innerHTML = data.trace.map(b =>
                `<div class="step-item ${b.loai || ''}">
                    <strong>Buoc ${b.so_buoc}:</strong> ${b.mo_ta}
                    ${b.trang_thai?.length ? ' | Trang thai: [' + b.trang_thai.join(', ') + ']' : ''}
                </div>`
            ).join('');
        } else {
            traceBox.innerHTML = '<p class="text-muted">Khong co du lieu trace.</p>';
        }
    } catch (err) {
        errEl.textContent = 'Loi ket noi server: ' + err.message;
        errEl.classList.remove('d-none');
    }
}
</script>
</body>
</html>
