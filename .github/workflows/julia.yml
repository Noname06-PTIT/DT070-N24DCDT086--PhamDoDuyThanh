name: Julia CI – DT070 LinkedQueue Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ['1.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cai dat Julia ${{ matrix.julia-version }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Chay bo kiem thu
        run: julia --startup-file=no test/runtests.jl
