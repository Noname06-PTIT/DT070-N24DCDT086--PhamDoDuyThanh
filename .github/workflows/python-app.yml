name: CI/CD - Kiem thu tu dong

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cai dat Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cai dat thu vien
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Chay kiem thu Pytest
      run: |
        pytest tests/test_logic.py -v
